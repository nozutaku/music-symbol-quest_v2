<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音楽記号クエスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="screen-start" class="screen">
      <h1>🎵 音楽記号クエスト</h1>
      <p class="lead">記号の読み方と意味をクイズで覚えよう。<br>ライフは3つ。連続正解でボーナス！</p>
      <div id="categories" class="categories"></div>
      <p class="best">ベストスコア: <strong id="best-score">0</strong></p>
    </section>

    <section id="screen-play" class="screen" hidden>
      <div class="status">
        <span id="st-progress"></span>
        <span id="st-lives" aria-label="ライフ"></span>
        <span id="st-score"></span>
        <span id="st-combo"></span>
      </div>
      <div class="question">
        <div id="q-label" class="q-label"></div>
        <div id="q-main" class="q-main"></div>
        <div id="q-sub" class="q-sub"></div>
      </div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback" hidden>
        <p id="fb-text"></p>
        <p id="fb-detail"></p>
        <button id="btn-next" type="button">次へ ▶</button>
      </div>
    </section>

    <section id="screen-result" class="screen" hidden>
      <h2 id="rs-title"></h2>
      <div id="rs-rank" class="rank"></div>
      <p id="rs-detail"></p>
      <p id="rs-new" class="new-record" hidden>🎉 ベストスコア更新！</p>
      <button id="btn-retry" type="button">もう一度</button>
      <button id="btn-menu" type="button" class="secondary">メニューへ</button>
    </section>
  </main>
  <script src="src/symbols.js"></script>
  <script src="src/glyphs.js"></script>
  <button id="btn-sound" type="button" class="sound-toggle" aria-pressed="false" aria-label="効果音">🔊</button>
  <script src="src/game.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
